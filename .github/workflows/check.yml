name: Warehouse checks
on: [push, workflow_dispatch]
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_workflow.py tests/test_insurance_tools.py
        env:
          TEST_DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
  insurance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_insurance_tools.py tests/test_insurance_coolsms.py tests/test_insurance_api.py
  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing app and new insurance UI syntax
        run: |
          node --input-type=module --check < web/app.js
          node --input-type=module --check < web/insurance-tool.js
          node --input-type=module --check < web/insurance-sender.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /codepage:65001 /target:winexe /out:windows\ScooterWarehouse.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll windows\Launcher.cs
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-launcher
          path: windows/ScooterWarehouse.exe
