name: Warehouse checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements-dev.txt) { pip install -r requirements-dev.txt }
          if (Test-Path requirements-insurance.txt) { pip install -r requirements-insurance.txt }
      - run: python -m pytest -q tests/test_workflow.py tests/test_photo_storage.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-insurance.txt ]; then pip install -r requirements-insurance.txt; fi
      - env:
          TEST_DATABASE_URL: postgresql+psycopg://testuser:testpass@localhost:5432/testdb
        run: python -m pytest -q tests/test_workflow.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /nologo /codepage:65001 /target:winexe /out:windows\ScooterWarehouse.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll windows\Launcher.cs
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-launcher
          path: windows/ScooterWarehouse.exe
          retention-days: 3
