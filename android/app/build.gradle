plugins { id 'com.android.application' }
android {
    namespace 'com.hakom.warehouse'
    compileSdk 35
    buildToolsVersion "35.0.0"
    defaultConfig { applicationId 'com.hakom.warehouse.photos'; minSdk 26; targetSdk 35; versionCode 31; versionName '1.0.31' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.camera:camera-camera2:1.4.1'
    implementation 'androidx.camera:camera-lifecycle:1.4.1'
    implementation 'androidx.camera:camera-view:1.4.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}

// Release signing must use the existing installation key, supplied outside this repository.
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "스쿠터창고.apk" }
}
